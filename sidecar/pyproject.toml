[project]
name = "picturebook-sidecar"
version = "0.1.0"
description = "Local inference sidecar for PictureBOOK (HTTP + SSE, bearer-token auth, bound to 127.0.0.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# Everything the Phase 1 stage scripts (scripts/*.py) import. Pinned to the versions all measurements in docs/research/ were made with.
# torch 2.12.1 from PyPI is the CUDA 13.0 build for Linux. Left out of a light test run with: uv sync --no-group pipeline
pipeline = [
    "torch==2.12.1",
    "diffusers==0.40.0",
    "transformers==5.5.0",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "safetensors==0.8.0",
    "huggingface-hub==1.28.0",
    "tokenizers==0.22.2",
    "soundfile==0.14.0",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "sentencepiece==0.2.2",
]

[tool.uv]
default-groups = ["dev", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["picturebook_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
