[package]
name = "picturebook-core"
description = "PictureBOOK core logic without any UI dependency: sidecar supervisor, HTTP/SSE client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros", "sync"] }
# Loopback HTTP only: no TLS stack is compiled in.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
thiserror = "2"
